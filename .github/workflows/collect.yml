name: Coleta eleitoral independente

on:
  push:
    branches: [main]
    paths:
      - collector.mjs
      - collector.test.mjs
      - municipal.mjs
      - municipal.test.mjs
      - .github/workflows/collect.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: election-2026-data-collector
  cancel-in-progress: true

jobs:
  collect:
    # Interrompido a pedido do usuário em 2026-10-27.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Obter código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, official SHA verified
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Verificar coletor
        run: node --test collector.test.mjs municipal.test.mjs
      - name: Preparar branch de dados separado
        shell: bash
        run: |
          set -euo pipefail
          data_dir="${RUNNER_TEMP}/elections-monitor-data"
          if git ls-remote --exit-code --heads origin refs/heads/data >/dev/null 2>&1; then
            git fetch origin refs/heads/data:refs/remotes/origin/data
            git worktree add --detach "$data_dir" refs/remotes/origin/data
          else
            git worktree add --detach "$data_dir" HEAD
            git -C "$data_dir" switch --orphan collector-data
          fi
          echo "COLLECTOR_DATA_DIR=$data_dir" >> "$GITHUB_ENV"
      - name: Coletar, preservar histórico e publicar a cada minuto
        run: node collector.mjs --data-dir "$COLLECTOR_DATA_DIR" --duration-minutes 330 --publish
